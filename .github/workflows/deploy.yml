name: Deploy VOID Downloader

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-vps-void
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, vps-void]

    steps:
      - name: Deploy Local VOID Instance
        run: |
          (
            flock -x -w 300 200 || { echo "ERROR: Another deployment is active in server"; exit 1; }

            set -e
            export PATH="/usr/local/bin:/usr/bin:$PATH"

            cd /var/www/void-downloader

            rm -f .git/index.lock

            echo "=== 1. Fetching latest main ==="
            git fetch origin main
            git reset --hard origin/main

            echo "=== 2. Installing Backend dependencies ==="
            cd /var/www/void-downloader/backend
            npm install

            echo "=== 3. Building Frontend SPA bundle ==="
            cd /var/www/void-downloader/frontend
            npm install
            nice -n 10 npm run build

            echo "=== 4. Reloading Backend API in PM2 ==="
            pm2 describe downloader-backend > /dev/null \
              && pm2 reload downloader-backend --update-env \
              || pm2 start src/app.js --name downloader-backend

            pm2 save
            echo "=== Deployment VOID Downloader Completed Successfully ==="
          ) 200>/tmp/void_deploy.lock
